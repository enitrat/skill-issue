# Single inventory for every package this repo installs.
#
# ~/.config/mise/config.toml and ~/.config/homebrew/Brewfile are both generated
# from this file, and the provisioning scripts re-run whenever it changes. Add a
# package here and nowhere else.
#
# Placement rule: anything mise can install cross-platform goes in [[mise]].
# [[cask]] and [[formula]] are macOS-only and exist for GUI apps and the few
# things mise cannot provide.

# --- CLI tools -------------------------------------------------------------
[[mise]]
name = "atuin"
[[mise]]
name = "bat"
[[mise]]
name = "carapace"
[[mise]]
name = "delta"
[[mise]]
name = "difftastic"
[[mise]]
name = "eza"
[[mise]]
name = "fd"
[[mise]]
name = "fzf"
[[mise]]
name = "gh"
[[mise]]
name = "ripgrep"
[[mise]]
name = "starship"
[[mise]]
name = "tmux"
[[mise]]
name = "uv"
[[mise]]
name = "zoxide"
[[mise]]
name = "terraform"

# Repo tooling: the pre-commit hooks in .pre-commit-config.yaml need these on
# PATH, so they are provisioned like anything else rather than assumed.
[[mise]]
name = "prek"
[[mise]]
name = "shellcheck"

# --- Runtimes --------------------------------------------------------------
[[mise]]
name = "node"
version = "lts"
[[mise]]
name = "python"
[[mise]]
name = "go"
[[mise]]
name = "rust"
[[mise]]
name = "bun"
[[mise]]
name = "pnpm"

# --- Tools from non-default mise backends ----------------------------------
[[mise]]
name = "github:abhinav/git-spice"
[[mise]]
name = "github:joshmedeski/sesh"
# schpet/linear-cli. Homebrew has a tap for it, but the GitHub releases cover
# macOS and Linux equally, so it stays cross-platform here. Binary is `linear`.
[[mise]]
name = "github:schpet/linear-cli"
# Hosted on GitLab with no release binaries, so it has to be built.
[[mise]]
name = "cargo:mergiraf"
# Bitwarden CLI (binary is `bw`). Taken from npm rather than the homebrew-core
# formula of the same name, which depends on Homebrew's node and would stand up
# a second Node alongside the mise-managed one. Cross-platform, so it belongs
# here by the placement rule at the top of this file either way.
[[mise]]
name = "npm:@bitwarden/cli"

# --- macOS GUI apps --------------------------------------------------------
[[cask]]
name = "bitwarden"
note = "desktop vault; self-updating, so brew will not manage upgrades"
[[cask]]
name = "1password-cli"
[[cask]]
name = "raycast"
[[cask]]
name = "slack"
[[cask]]
name = "telegram"
note = "native macOS client; 'telegram-desktop' is the cross-platform Qt build"
[[cask]]
name = "cursor"
[[cask]]
name = "tailscale-app"
note = "renamed upstream from 'tailscale'; the old name still resolves but warns"
# Amphetamine is not here because it cannot be: it ships only through the Mac
# App Store, so there is no cask for it and `brew search amphetamine` returns
# nothing. Install it from the App Store by hand. Leaving the entry in place
# broke the whole Brewfile -- `brew bundle` aborts on the first unresolvable
# name and then reports every other entry as failed too, which reads as a
# systemic outage rather than one bad line.
[[cask]]
name = "hiddenbar"
note = "hide/reveal menu-bar icons around the notch"
[[cask]]
name = "orbstack"
note = "free for personal use; commercial use needs a paid license"
[[cask]]
name = "font-meslo-lg-nerd-font"
note = "installs under the name \"MesloLGS NF\""

# --- macOS formulae mise cannot provide ------------------------------------
# gcc@15 and llvm@19 used to be pinned in .chezmoidata/vars.toml, because their
# install paths were referenced by PATH entries and by global LDFLAGS/CPPFLAGS.
# Both the formulae and the references are gone -- Apple clang is the compiler
# here, and a project needing a different one should pin it in its own
# mise.toml rather than shadowing `cc` for the whole machine.
[[formula]]
name = "mosh"
note = "roaming-friendly SSH for flaky connections"

# --- Python tools ----------------------------------------------------------
# Installed with `uv tool install` -- mise's pipx backend needs a pre-existing
# pipx that nothing else here wants.
[[uvtool]]
name = "httpie"
