# ~/.tmux.conf — managed by chezmoi (skill-issue).
# Dependency-free (no TPM/plugins) so it works as-is on any freshly
# provisioned remote box.

# --- General ---------------------------------------------------------------
set -g mouse on
set -g history-limit 50000
set -sg escape-time 10                # the default 500ms makes <Esc> lag in vim
set -g focus-events on                # let editors detect pane refocus
set -g base-index 1                   # match the number row on the keyboard
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-clipboard on               # OSC52, so copy works over ssh too

# RGB passthrough to the outer terminal.
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB,*256col*:RGB"

# --- Copy mode (vi) --------------------------------------------------------
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel

# --- Key bindings ----------------------------------------------------------
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# Splits and new windows inherit the current directory.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

bind c new-window -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# -r keeps the binding live after the prefix, so resizing is hold-and-tap.
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Shows a shell error on a box without sesh and fzf installed.
bind T display-popup -E "sesh connect \"\$(sesh list | fzf --height 40% --reverse)\""

# --- Status bar ------------------------------------------------------------
set -g status-position top
set -g status-style "bg=default,fg=white"
set -g status-left "#[fg=green,bold]#S #[default]"
set -g status-left-length 30
set -g status-right "#[fg=cyan]#h #[fg=white]%H:%M "
set -g window-status-current-format "#[fg=yellow,bold]#I:#W"
set -g window-status-format "#[fg=white]#I:#W"
