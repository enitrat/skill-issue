# ~/.tmux.conf — managed by chezmoi (skill-issue).
# Dependency-free (no TPM/plugins) so it works as-is on any freshly
# provisioned remote box.

# --- General ---------------------------------------------------------------
set -g mouse on                       # scroll + click to select panes/windows
set -g history-limit 50000            # bigger scrollback
set -sg escape-time 10                # snappier <Esc> in vim/neovim
set -g focus-events on                # let editors detect pane refocus
set -g base-index 1                   # windows start at 1 (matches the keyboard)
setw -g pane-base-index 1
set -g renumber-windows on            # keep window numbers gap-free
set -g set-clipboard on               # OSC52 -> system clipboard (works over ssh)

# True color: tmux-256color inside, RGB passthrough to the outer terminal.
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB,*256col*:RGB"

# --- Copy mode (vi) --------------------------------------------------------
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel

# --- Key bindings ----------------------------------------------------------
# Reload config (prefix + r)
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# Intuitive splits that keep the current directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New window in the current directory
bind c new-window -c "#{pane_current_path}"

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes (repeatable: hold the modifier and tap)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# sesh session switcher (prefix + T). Needs sesh + fzf, both provisioned by
# this repo; on a box without them the popup just shows a shell error.
bind T display-popup -E "sesh connect \"\$(sesh list | fzf --height 40% --reverse)\""

# --- Status bar (minimal, matches the transparent starship look) -----------
set -g status-position top
set -g status-style "bg=default,fg=white"
set -g status-left "#[fg=green,bold]#S #[default]"
set -g status-left-length 30
set -g status-right "#[fg=cyan]#h #[fg=white]%H:%M "
set -g window-status-current-format "#[fg=yellow,bold]#I:#W"
set -g window-status-format "#[fg=white]#I:#W"
