name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          # Dependencies live in the PEP 723 inline metadata of these scripts,
          # not in a requirements.txt/pyproject.toml/uv.lock (setup-uv's
          # default glob), so the cache key has to watch them explicitly.
          cache-dependency-glob: |
            slack_user_cli.py
            tests/test_slack_user_cli.py
            tests/test_vault_config.py

      - name: Run tests
        run: |
          uv run --script tests/test_slack_user_cli.py
          uv run --script tests/test_vault_config.py
