name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          # Dependencies live in the PEP 723 inline metadata of these scripts,
          # not in a requirements.txt/pyproject.toml/uv.lock (setup-uv's
          # default glob), so the cache key has to watch them explicitly.
          cache-dependency-glob: |
            slack_user_cli.py
            tests/test_slack_user_cli.py

      - name: Run tests
        run: uv run tests/test_slack_user_cli.py
