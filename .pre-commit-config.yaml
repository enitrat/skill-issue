# Run with `prek` (https://github.com/j178/prek), a drop-in pre-commit runner.
#   prek install     # once, to wire up .git/hooks/pre-commit
#   prek run --all-files
#
# prek, shellcheck and nixfmt come from this repo's devShell (direnv loads it).

repos:
  - repo: local
    hooks:
      - id: nixfmt
        name: nixfmt
        entry: nixfmt --check
        language: system
        files: \.nix$

      - id: shellcheck
        name: shellcheck (tools, scripts, bootstrap, nix)
        entry: shellcheck
        language: system
        types: [shell]
        # shellcheck does not parse zsh.
        exclude_types: [zsh]
        files: ^(tools|scripts|bootstrap|nix)/

      - id: tools-executable
        name: tools are executable
        entry: >-
          bash -c 'bad=$(find tools scripts bootstrap -type f ! -perm -u+x);
          [ -z "$bad" ] || { echo "not executable:"; echo "$bad"; exit 1; }'
        language: system
        pass_filenames: false
        files: ^(tools|scripts|bootstrap)/

  # Scoped to the machine-setup surface on purpose. Run repo-wide these rewrite
  # a few hundred lines of skills/ prose, which buries the changes that matter.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        files: ^(nix|tools|scripts|bootstrap)/
      - id: end-of-file-fixer
        files: ^(nix|tools|scripts|bootstrap)/
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-executables-have-shebangs
